<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pokemon Watchdog — Price Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>🐾 Pokemon Watchdog</h1>
    <nav class="site-nav">
      <a href="index.html" class="active">Prices &amp; Deals</a>
      <a href="rarity.html">By Rarity</a>
    </nav>
    <span class="last-updated" id="last-updated"></span>
  </header>

  <main>
    <div class="stat-row">
      <div class="stat-card"><div class="label">Items shown</div><div class="value" id="stat-total">—</div></div>
      <div class="stat-card"><div class="label">Average price</div><div class="value" id="stat-avg">—</div></div>
      <div class="stat-card"><div class="label">Best deal right now</div><div class="value" id="stat-best-deal">—</div></div>
    </div>

    <div class="tabs">
      <button class="active" data-tab="all">All items</button>
      <button data-tab="deals">Best deals</button>
    </div>

    <div class="toolbar">
      <input type="text" id="search" placeholder="Search by card, box, or set name…">
      <select id="set-filter"><option value="all">All sets</option></select>
      <select id="type-filter">
        <option value="all">All types</option>
        <option value="card">Cards</option>
        <option value="sealed">Sealed</option>
      </select>
      <select id="rarity-filter"><option value="all">All rarities</option></select>
      <div class="budget-filter">
        <input type="number" id="min-price" placeholder="Min $" min="0" step="0.5">
        <span>–</span>
        <input type="number" id="max-price" placeholder="Max $" min="0" step="0.5">
      </div>
      <button id="clear-filters" type="button">Clear filters</button>
    </div>

    <div id="item-table-root"></div>
  </main>

  <footer>
    Prices sourced from TCGplayer market data via <a href="https://tcgcsv.com" target="_blank" rel="noopener">tcgcsv.com</a>.
    "vs Avg" compares current price to its own trailing ~90-day average — not financial advice.
  </footer>

  <script src="js/data-loader.js"></script>
  <script src="js/table.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
